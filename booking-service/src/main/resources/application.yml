spring:
  application:
    name: booking-service
  config:
    import: "optional:configserver:${CONFIG_SERVER_URI:http://localhost:8888}"
  datasource:
    url: jdbc:h2:mem:bookingdb;DB_CLOSE_DELAY=-1
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  cloud:
    openfeign:
      # Enveloppe chaque client Feign dans un circuit breaker Resilience4j (fallbackFactory)
      circuitbreaker:
        enabled: true
      httpclient:
        hc5:
          enabled: true

server:
  port: 8092

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}

booking:
  payment-deadline-minutes: 60
  cancellation-deadline-hours: 24
  circuit-breaker:
    timeout: 5s
  scheduler:
    enabled: true
    expiration-rate-ms: 300000
    reminder-rate-ms: 900000
    initial-delay-ms: 30000
