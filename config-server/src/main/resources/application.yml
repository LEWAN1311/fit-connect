server:
  port: 8888

spring:
  application:
    name: config-server
  profiles:
    active: native
  cloud:
    config:
      server:
        native:
          # Recherche des fichiers de configuration dans le dossier config-repo :
          # depuis le dossier du module config-server, ou depuis la racine du projet
          search-locations: file:./config-repo, file:./config-server/config-repo

management:
  endpoints:
    web:
      exposure:
        include: health,info
